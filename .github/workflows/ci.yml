name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly installing pytest here ensures it's available 
          # even if the cache is out of sync with requirements.txt
          pip install pytest flake8 black isort mypy
          pip install -r requirements.txt

      - name: Check formatting with Black
        run: black . --check

      - name: Sort imports with isort
        run: isort . --check-only --profile black

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity check: ensure functions aren't getting too messy
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics
          # Ensure compatibility with Black
          flake8 . --extend-ignore=E203, W503 --statistics

      - name: Static type check with mypy
        run: mypy . --ignore-missing-imports

      - name: Run All Tests
        run: |
          # Runs both test_analyzer.py and test_app.py
          python -m pytest tests/
        env:
          # Required because analyzer.py checks for this on import
          GROQ_API_KEY: "dummy_key_for_testing"