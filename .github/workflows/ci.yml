name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Essential for running the app and tests
          pip install -r requirements.txt

      - name: Run All Tests
        run: |
          # This will automatically find and run test_analyzer.py and test_app.py
          python -m pytest tests/
        env:
          # We provide a dummy key so the app initializes without crashing, 
          # but our mocks will prevent actual API calls.
          GROQ_API_KEY: "dummy_key_for_testing"

      - name: Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics